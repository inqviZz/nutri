name: Сборка APK
on:
  push:
    paths:
      - 'project.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Распаковать проект из project.zip
        run: |
          test -f project.zip || { echo "Нет файла project.zip в корне репозитория"; exit 1; }
          mkdir app
          unzip -q project.zip -d app
          echo "Файлов в проекте: $(find app -type f | wc -l)"
          for f in package.json app.json src/app/body.tsx src/app/measures.tsx; do test -f "app/$f" || { echo "В архиве нет $f"; exit 1; }; done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Принять лицензии Android SDK (SDK уже установлен на сервере)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Установка зависимостей
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Подготовка Android-проекта
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      - name: Настройка сборки (только arm64 - все современные Samsung)
        working-directory: app/android
        run: |
          sed -i '/^reactNativeArchitectures/d' gradle.properties
          printf '\nreactNativeArchitectures=arm64-v8a\n' >> gradle.properties
      - name: Сборка APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon --console=plain
      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: Nutri-APK
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
