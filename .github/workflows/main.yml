name: Сборка APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Принять лицензии Android SDK (SDK уже установлен на сервере)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund
      - name: Подготовка Android-проекта
        run: npx expo prebuild --platform android --no-install
      - name: Настройка сборки (только arm64 - все современные Samsung)
        run: |
          cd android
          sed -i '/^reactNativeArchitectures/d' gradle.properties
          printf '\nreactNativeArchitectures=arm64-v8a\n' >> gradle.properties
      - name: Сборка APK
        run: cd android && ./gradlew assembleRelease --no-daemon --console=plain
      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: Nutri-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
